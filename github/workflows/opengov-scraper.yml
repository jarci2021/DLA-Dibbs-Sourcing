name: OpenGov Bid Scraper

on:
  schedule:
    # Runs daily at 8:00 AM UTC -- adjust the cron time to whatever
    # schedule matches your DIBBS/SAM.gov polling frequency.
    # Cron format: minute hour day month weekday
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Lets you trigger this manually from the GitHub Actions tab --
    # useful for the first test run, and any time you want to force
    # a check without waiting for the schedule.

jobs:
  scrape-opengov:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run OpenGov scraper
        env:
          OPENGOV_EMAIL: ${{ secrets.OPENGOV_EMAIL }}
          OPENGOV_PASSWORD: ${{ secrets.OPENGOV_PASSWORD }}
          TWIDGET_OPENGOV_URL: ${{ secrets.TWIDGET_OPENGOV_URL }}
          OPENGOV_VENDOR_ID: '274125'
          HEADLESS: 'true'
          DEBUG_SCREENSHOTS: 'false'
        run: python scrape_opengov.py

      # Commits the updated "seen bids" state file back to the repo so
      # the next scheduled run knows what's already been sent. Same
      # pattern you'd want to check the DIBBS workflow already uses for
      # its seen_solicitations.json file.
      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opengov_seen_bids.json
          git diff --staged --quiet || git commit -m "Update OpenGov seen bids state"
          git push
